name: CI/CD & Vercel Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Build Production Assets
        run: npm run build

  deploy:
    name: Deploy to Vercel
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "Deploying to Vercel using Vercel CLI..."
            npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
            npx vercel build --prod --token=$VERCEL_TOKEN
            npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
          else
            echo "Notice: VERCEL_TOKEN secret is not configured in GitHub repository secrets."
            echo "If you have connected GitHub to Vercel directly via https://vercel.com/yuriy-degtyars-projects-0321a19b/liber-journal/settings/git, Vercel deploys automatically on every push."
          fi
